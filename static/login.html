<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pine Coin — Sign In</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233a414c'/%3E%3Cstop offset='50%25' stop-color='%23181a20'/%3E%3Cstop offset='100%25' stop-color='%230b0e11'/%3E%3C/linearGradient%3E%3ClinearGradient id='gl' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='rgba(255,255,255,0.5)'/%3E%3Cstop offset='100%25' stop-color='rgba(255,255,255,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23bg)' stroke='%23fcd535' stroke-width='4' stroke-linejoin='round' d='M50 10 L70 30 L60 40 L75 55 L60 65 L70 80 L50 95 L30 80 L40 65 L25 55 L40 40 L30 30 Z'/%3E%3Cpath fill='url(%23gl)' d='M50 10 L30 30 L40 40 L25 55 L40 65 L30 80 L50 95 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0b0e11;
    --bg-secondary: #181a20;
    --bg-tertiary: #2b3139;
    --border: #2b3139;
    --text-primary: #eaecef;
    --text-secondary: #b7bdc6;
    --text-muted: #848e9c;
    --accent: #fcd535;
    --red: #f6465d;
    --red-dim: rgba(246,70,93,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }

  .login-card {
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px 40px; width: 400px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .logo span { color: var(--accent); margin-left: -4px; }

  .subtitle {
    font-size: 14px; color: var(--text-muted); margin-bottom: 36px;
    font-weight: 400;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .field input {
    width: 100%; background: var(--bg-primary);
    border: 1px solid var(--border); color: var(--text-primary);
    padding: 12px 16px; border-radius: 8px; font-size: 14px;
    font-family: 'Inter', sans-serif; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--text-muted); }

  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--bg-primary);
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif; margin-top: 8px;
    transition: opacity 0.15s;
  }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.4; cursor: wait; }

  .error-msg {
    color: var(--red); font-size: 13px; margin-top: 14px;
    background: var(--red-dim); padding: 10px 14px; border-radius: 6px;
    display: none; font-weight: 500;
  }
  .error-msg.show { display: block; }

  .footer {
    text-align: center; margin-top: 28px; font-size: 12px;
    color: var(--text-muted); font-weight: 500;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3a414c"/><stop offset="50%" stop-color="#181a20"/><stop offset="100%" stop-color="#0b0e11"/></linearGradient>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient>
      </defs>
      <path fill="url(#b)" stroke="#fcd535" stroke-width="4" stroke-linejoin="round" d="M50 10 L70 30 L60 40 L75 55 L60 65 L70 80 L50 95 L30 80 L40 65 L25 55 L40 40 L30 30 Z"/>
      <path fill="url(#g)" d="M50 10 L30 30 L40 40 L25 55 L40 65 L30 80 L50 95 Z"/>
    </svg>
    Pine<span> Coin</span>
  </div>
  <p class="subtitle">Sign in to access the dashboard</p>

  <div class="field">
    <label>Username</label>
    <input type="text" id="user" placeholder="demo" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="pass" placeholder="demo" autocomplete="current-password">
  </div>

  <button class="submit-btn" id="btn">Sign In</button>
  <div class="error-msg" id="err"></div>

  <div class="footer">JWT Auth · Rate Limited · Pine Coin Dashboard</div>
</div>

<script>
// Redirect if already logged in
if (sessionStorage.getItem('jwt')) {
  window.location.href = '/dashboard';
}

const btn = document.getElementById('btn');
const err = document.getElementById('err');

async function login() {
  btn.disabled = true;
  err.classList.remove('show');

  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;

  try {
    const res = await fetch('/api/v1/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    sessionStorage.setItem('jwt', data.token);
    window.location.href = '/dashboard';
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener('click', login);
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pass').focus(); });
</script>
</body>
</html>
