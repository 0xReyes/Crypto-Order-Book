name: Deploy to Kubernetes

on:
  workflow_dispatch:          # Manual trigger only (safe)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Build & push Docker image (optional — if using your own registry)
        run: |
          docker build -t yourusername/crypto-dashboard:${{ github.sha }} .
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u yourusername --password-stdin
          docker push yourusername/crypto-dashboard:${{ github.sha }}

      - name: Deploy manifests
        run: |
          # Update image tag if needed (sed example)
          sed -i "s|image: .*|image: yourusername/crypto-dashboard:${{ github.sha }}|" deployment.yaml
          
          kubectl apply -f namespace.yaml
          kubectl apply -f secret.yaml     # or patch secrets separately
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f hpa.yaml
          kubectl apply -f ingress.yaml     # if you have one

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/crypto-dashboard --timeout=120s
          kubectl get pods -l app=crypto-dashboard
          echo "Deployment complete — check your ingress/domain"