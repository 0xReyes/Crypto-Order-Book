name: Run order book server

on:
  workflow_dispatch:
  # Uncomment to run on a schedule (max 6h per job on free tier)
  # schedule:
  #   - cron: "0 */5 * * *"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Free tier cap is 6h; set lower as needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build server
        run: go build -o aggregator main.go

      - name: Start server in background
        run: |
          ./aggregator &
          # Wait until the server is accepting connections
          for i in $(seq 1 10); do
            curl -sf "http://localhost:8080/api/v1/book?symbol=BTC-USDT&limit=1" > /dev/null && break
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "✅ Server is up"

      - name: Install cloudflared
        run: |
          # Pin to a specific release — avoids pulling a broken "latest"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2025.2.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Open Cloudflare tunnel
        run: |
          MAX_ATTEMPTS=5
          ATTEMPT=0
          URL=""

          while [ -z "$URL" ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "--- Tunnel attempt $ATTEMPT/$MAX_ATTEMPTS ---"

            # Kill any previous cloudflared instance and clear log
            pkill -f cloudflared || true
            sleep 2
            > /tmp/cf.log

            cloudflared tunnel --url http://localhost:8080 --no-autoupdate 2>&1 | tee /tmp/cf.log &
            CF_PID=$!

            # Wait up to 20s for the URL to appear in the log
            for i in $(seq 1 20); do
              URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
              [ -n "$URL" ] && break

              # Bail early if cloudflared already hit the QuickTunnel API error
              if grep -q 'failed to unmarshal\|ERR.*QuickTunnel' /tmp/cf.log; then
                echo "⚠️  Tunnel API error — retrying in 10s..."
                sleep 10
                break
              fi

              sleep 1
            done
          done

          if [ -z "$URL" ]; then
            echo "❌ Could not establish tunnel after $MAX_ATTEMPTS attempts."
            echo "--- Last cloudflared log ---"
            cat /tmp/cf.log
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "  🌐 Public URL: $URL"
          echo "  📖 Order book: $URL/api/v1/book?symbol=BTC-USDT&limit=50"
          echo "============================================"

          # Keep the job alive — cancel via Actions UI when done
          wait $CF_PID