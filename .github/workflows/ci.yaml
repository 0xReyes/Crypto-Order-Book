name: CI + Kind Deploy Test

on:
  push:
    branches: [main, test, test2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binary (for reference)
        run: go build -o aggregator .

      - name: Build Docker image
        run: docker build -t crypto-dashboard:ci .

      - name: Set up kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.24.0
          config: .github/kind-config.yaml
          cluster_name: chart-testing   # your custom name
          wait: 60s
          verbosity: 1

      - name: Load image into kind
        run: kind load docker-image crypto-dashboard:ci --name chart-testing

      - name: Deploy secrets (for testing)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: crypto-overview-secrets
          type: Opaque
          stringData:
            JWT_SECRET: "kind-test-secret-1234567890"
            API_USER: "testadmin"
            API_PASS: "testpass123"
          EOF

      - name: Deploy manifests
        run: |
          kubectl apply -f namespace.yaml || true
          kubectl apply -f deployment.yaml -n crypto-dashboard || true
          kubectl apply -f service.yaml -n crypto-dashboard || true

          # Override image tag to the one loaded in kind
          kubectl set image deployment/crypto-dashboard dashboard=crypto-dashboard:ci -n crypto-dashboard

      - name: Wait for rollout & verify
        run: |
          kubectl rollout status deployment/crypto-dashboard -n crypto-dashboard --timeout=120s || true
          kubectl get pods -l app=crypto-dashboard -n crypto-dashboard
          kubectl get svc crypto-dashboard -n crypto-dashboard
          echo "Kind deploy test complete ✓ (temporary cluster)"

      - name: Show pod status & logs
        if: always()
        run: |
          kubectl get pods -n crypto-dashboard -o wide
          kubectl describe pod -l app=crypto-dashboard -n crypto-dashboard || true
          kubectl logs -l app=crypto-dashboard -n crypto-dashboard --tail=30 || true