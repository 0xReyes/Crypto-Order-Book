name: CI + Kind Deploy Test (with Cloudflare tunnel)

on:
  push:
    branches: [main, test, test2]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-deploy-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binary
        run: go mod tidy && go build -o aggregator .

      - name: Build Docker image
        run: docker build -t crypto-dashboard:ci .

      - name: Set up kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.24.0
          config: .github/kind-config.yaml
          cluster_name: chart-testing
          wait: 60s
          verbosity: 1

      - name: Load image into kind
        run: kind load docker-image crypto-dashboard:ci --name chart-testing

      - name: Install MetalLB (LoadBalancer for Kind)
        run: |
          chmod +x setup-metallb.sh
          ./setup-metallb.sh

      - name: Make scripts executable
        run: chmod +x deploy.sh manage-secret.sh

      - name: Deploy with unified script (CI mode)
        env:
          CI: true
          JWT_SECRET: "kind-test-secret-1234567890"
          API_USER: "testadmin"
          API_PASS: "testpass123"
          TAG: ci
        run: ./deploy.sh k8s

      - name: Verify deployment & LoadBalancer
        run: |
          kubectl rollout status deployment/crypto-dashboard -n crypto-dashboard --timeout=30s
          kubectl get pods -l app=crypto-dashboard -n crypto-dashboard
          echo ""

          echo "→ Waiting for LoadBalancer external IP..."
          for i in $(seq 1 30); do
            LB_IP=$(kubectl get svc crypto-dashboard -n crypto-dashboard \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [[ -n "$LB_IP" ]]; then
              echo "✅ LoadBalancer IP: $LB_IP"
              echo "LB_IP=$LB_IP" >> "$GITHUB_ENV"
              break
            fi
            echo "  Waiting... ($i)"
            sleep 2
          done

          if [[ -z "${LB_IP:-}" ]]; then
            echo "⚠️  No LB IP assigned — falling back to port-forward"
            echo "LB_IP=" >> "$GITHUB_ENV"
          fi

          kubectl get svc crypto-dashboard -n crypto-dashboard
          echo ""
          echo "Kind deploy test complete ✓"

      - name: Test via LoadBalancer (or port-forward fallback)
        run: |
          set -e

          if [[ -n "$LB_IP" ]]; then
            BASE="http://$LB_IP"
            echo "→ Testing via LoadBalancer at $BASE"
          else
            echo "→ No LB IP — using port-forward fallback"
            kubectl port-forward svc/crypto-dashboard -n crypto-dashboard 8080:80 &
            PF_PID=$!
            sleep 3
            BASE="http://localhost:8080"
          fi

          echo "→ Health check..."
          curl --fail --retry 5 --retry-connrefused "$BASE/api/v1/health"
          echo ""

          echo "→ Login page..."
          curl -sf "$BASE/login" | grep -q "Pine Coin" && echo "✅ Login page OK"

          echo "→ Dashboard page..."
          curl -sf "$BASE/dashboard" | grep -q "Pine Coin Dashboard" && echo "✅ Dashboard page OK"

          echo "→ Obtaining JWT token..."
          TOKEN=$(curl -s -X POST "$BASE/api/v1/login" \
            -H "Content-Type: application/json" \
            -d '{"user":"testadmin","pass":"testpass123"}' | jq -r .token)

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "❌ Failed to obtain token"
            exit 1
          fi
          echo "✅ Token obtained: ${TOKEN:0:20}..."

          echo "→ Testing protected endpoint..."
          curl --fail -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/book?symbol=BTC-USDT&limit=1" > /dev/null
          echo "✅ Authenticated order book OK"

          echo "→ Testing auth rejection (no token)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/v1/book?symbol=BTC")
          [[ "$HTTP_CODE" == "401" ]] && echo "✅ Unauthenticated correctly rejected (401)"

          echo ""
          echo "✅ All endpoint tests passed"

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2025.2.1/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Expose via Cloudflare tunnel
        run: |
          if [[ -n "$LB_IP" ]]; then
            TUNNEL_TARGET="http://$LB_IP"
          else
            # Ensure port-forward is running
            if ! lsof -i :8080 > /dev/null 2>&1; then
              kubectl port-forward svc/crypto-dashboard -n crypto-dashboard 8080:80 &
              sleep 3
            fi
            TUNNEL_TARGET="http://localhost:8080"
          fi

          echo "→ Starting cloudflared tunnel to $TUNNEL_TARGET"
          cloudflared tunnel --url "$TUNNEL_TARGET" --no-autoupdate 2>&1 | tee /tmp/cf.log &
          CF_PID=$!

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "❌ Failed to get tunnel URL"
            cat /tmp/cf.log
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "  🌐 Public URL:  $URL"
          echo "  🔑 Login:       testadmin / testpass123"
          if [[ -n "$LB_IP" ]]; then
          echo "  ⚡ LoadBalancer: http://$LB_IP"
          fi
          echo "  📖 Order book:  $URL/api/v1/book?symbol=BTC-USDT&limit=50"
          echo ""
          echo "  ⏳ Tunnel is active. Cancel this job to stop."
          echo "============================================"

          wait $CF_PID

      - name: Show pod status & logs (on failure)
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n crypto-dashboard -o wide
          echo "=== Service ==="
          kubectl get svc -n crypto-dashboard -o wide
          echo "=== Describe ==="
          kubectl describe pod -l app=crypto-dashboard -n crypto-dashboard
          echo "=== Logs ==="
          kubectl logs -l app=crypto-dashboard -n crypto-dashboard --tail=30
          echo "=== MetalLB ==="
          kubectl get pods -n metallb-system 2>/dev/null || true