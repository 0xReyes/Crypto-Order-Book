name: CI + Kind Deploy Test

on:
  push:
    branches: [main, test, test2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go binary (for reference)
        run: go build -o aggregator .

      - name: Build Docker image
        run: docker build -t crypto-dashboard:ci .

      - name: Set up kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.24.0
          config: .github/kind-config.yaml   # ← points to your new file
          wait: 60s
          verbosity: 1

      - name: Load image into kind
        run: kind load docker-image crypto-dashboard:ci

      - name: Deploy secrets (for testing)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: crypto-overview-secrets
          type: Opaque
          stringData:
            JWT_SECRET: "kind-test-secret-1234567890"
            API_USER: "testadmin"
            API_PASS: "testpass123"
          EOF

      - name: Deploy manifests
        run: |
          kubectl apply -f namespace.yaml || true
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for rollout & verify
        run: |
          kubectl rollout status deployment/crypto-dashboard --timeout=120s || true
          kubectl get pods -l app=crypto-dashboard
          kubectl get svc crypto-dashboard
          echo "Kind deploy test complete ✓ (temporary cluster)"

      - name: Optional — quick internal curl test
        run: |
          kubectl port-forward svc/crypto-dashboard 8080:80 &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:8080/api/v1/health && echo "Health OK inside kind" || echo "Health check failed"
          kill $PF_PID 2>/dev/null || true